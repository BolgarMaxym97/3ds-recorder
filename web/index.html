<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>3DS Recorder</title>
<!-- The page the console serves (app/source/server.c) for one recording: it downloads the .r3d,
     turns it into an MP4 in the browser (web/app.js) and offers it to save. Everything is inlined
     by tools/build-web.py: nothing comes from the internet. -->
<style>
:root {
  --bg: #14161a; --surface: #242931; --surface2: #313740; --text: #e8eaed; --soft: #c3c8cf;
  --muted: #9aa3ad; --faint: #5a616b; --accent: #ff4d4f; --ok: #4cd07d; --ok-bg: #16301f;
  --warn: #ffb15c; --warn-bg: #3a2a14; --info: #6aa8ff; --info-bg: #1a2638; --err: #ff6b6b;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
  max-width: 560px; margin: 0 auto;
}
header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
header .logo { width: 34px; height: 34px; border-radius: 9px; background: #1f232a; display: grid; place-items: center; }
header .logo i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
header b { font-size: 18px; }
header span { color: var(--muted); font-size: 14px; margin-left: auto; }
.card { background: var(--surface); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.title { font-size: 21px; font-weight: 700; }
.sub { color: var(--muted); font-size: 14px; }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
.stat { background: var(--surface2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.stat .l { color: var(--muted); font-size: 12px; }
.stat .v { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.step + .step { border-top: 1px solid #2e343d; }
.step .n { width: 26px; height: 26px; border-radius: 50%; background: var(--surface2); display: grid; place-items: center;
  font-weight: 700; font-size: 13px; flex-shrink: 0; color: var(--muted); }
.step.on .n { background: var(--accent); color: #fff; }
.step.done .n { background: var(--ok); color: #0b1a10; }
.step .t { flex: 1; min-width: 0; }
.step .t b { display: block; }
.step .t small { color: var(--muted); font-size: 13px; display: block; }
.step .p { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.step.done .bar i { background: var(--ok); }
.note { border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 12px; }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.info { background: var(--info-bg); color: var(--soft); }
.note.err { background: #3a1a1c; color: var(--err); }
.note.ok { background: var(--ok-bg); color: var(--ok); }
button, .btn {
  display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; font: inherit; font-weight: 700;
  text-align: center; text-decoration: none; cursor: pointer; margin-bottom: 10px;
}
.primary { background: var(--text); color: var(--bg); }
.secondary { background: var(--surface); color: var(--text); }
.link { background: none; color: var(--muted); font-weight: 500; padding: 8px; text-decoration: underline; }
video { width: 100%; border-radius: 12px; background: #000; display: block; margin-bottom: 12px; }
canvas.hidden { position: fixed; left: -10000px; top: 0; width: 1px; height: 1px; }
ol { margin: 6px 0 0; padding-left: 20px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header><div class="logo"><i></i></div><b>3DS Recorder</b><span id="console"></span></header>

<div class="card">
  <div class="title" id="when">…</div>
  <div class="sub" id="fname"></div>
  <div class="stats">
    <div class="stat"><div class="l" data-t="length"></div><div class="v" id="len">—</div></div>
    <div class="stat"><div class="l" data-t="size"></div><div class="v" id="size">—</div></div>
    <div class="stat"><div class="l" data-t="eta"></div><div class="v" id="eta">—</div></div>
  </div>
</div>

<div class="note warn" id="long" hidden></div>
<div class="note err" id="error" hidden></div>

<div class="card" id="steps">
  <div class="step" id="s1"><div class="n">1</div><div class="t"><b data-t="s1"></b><small id="s1x"></small><div class="bar"><i id="b1"></i></div></div><div class="p" id="p1"></div></div>
  <div class="step" id="s2"><div class="n">2</div><div class="t"><b data-t="s2"></b><small id="s2x"></small><div class="bar"><i id="b2"></i></div></div><div class="p" id="p2"></div></div>
  <div class="step" id="s3"><div class="n">3</div><div class="t"><b data-t="s3"></b><small id="s3x"></small></div></div>
</div>

<button class="primary" id="start" hidden></button>
<div class="note info" id="keep" hidden></div>

<div id="result" hidden>
  <video id="preview" controls playsinline></video>
  <a class="btn primary" id="save" download></a>
  <div class="note info" id="howto"></div>
</div>

<button class="primary" id="retry" hidden></button>
<a class="btn primary" id="direct" hidden></a>
<a class="btn link" id="raw"></a>
<div class="note info" id="sd"></div>
<a class="btn link" id="diag" href="/log.txt" download data-t="diag"></a>

<canvas id="canvas" class="hidden" width="400" height="480"></canvas>

<script src="vendor/mp4-muxer.min.js"></script>
<script src="r3d.js"></script>
<script src="app.js"></script>
</body>
</html>
